<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spellbound · Catálogo de audio</title>
    <style>
      :root {
        --bg: #0d0f17;
        --panel: #161a26;
        --line: #2a3042;
        --text: #e9e2cf;
        --muted: #9a937f;
        --gold: #d8b46a;
        --ok: #6fbf73;
        --no: #d9675a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.45 Georgia,
          "Times New Roman",
          serif;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 16px 120px;
      }
      h1 {
        color: var(--gold);
        font-weight: normal;
        letter-spacing: 0.04em;
        margin: 0 0 4px;
      }
      .lede {
        color: var(--muted);
        margin: 0 0 28px;
      }
      h2 {
        color: var(--gold);
        font-weight: normal;
        font-size: 1.1rem;
        border-bottom: 1px solid var(--line);
        padding-bottom: 6px;
        margin: 32px 0 12px;
      }
      .item {
        display: grid;
        grid-template-columns: 1fr 320px auto;
        gap: 14px;
        align-items: center;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 8px;
      }
      .item[data-verdict="ok"] {
        border-color: color-mix(in srgb, var(--ok) 55%, var(--line));
      }
      .item[data-verdict="no"] {
        border-color: color-mix(in srgb, var(--no) 70%, var(--line));
      }
      .name {
        font-size: 1rem;
      }
      .meta {
        color: var(--muted);
        font-size: 0.8rem;
        font-family: ui-monospace, monospace;
      }
      .prompt {
        color: var(--muted);
        font-size: 0.82rem;
        margin-top: 2px;
      }
      audio {
        width: 100%;
      }
      .missing {
        color: var(--no);
        font-size: 0.85rem;
      }
      .verdict {
        display: flex;
        gap: 6px;
      }
      .verdict button {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font: inherit;
      }
      .item[data-verdict="ok"] .ok {
        color: var(--ok);
        border-color: var(--ok);
      }
      .item[data-verdict="no"] .no {
        color: var(--no);
        border-color: var(--no);
      }
      footer {
        position: fixed;
        inset: auto 0 0 0;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        border-top: 1px solid var(--line);
        padding: 12px 16px;
        display: flex;
        gap: 12px;
        justify-content: center;
        align-items: center;
      }
      footer button {
        background: var(--gold);
        color: #1a1408;
        border: 0;
        border-radius: 6px;
        padding: 8px 14px;
        font: inherit;
        cursor: pointer;
      }
      #count {
        color: var(--muted);
      }
      @media (max-width: 720px) {
        .item {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Spellbound · Catálogo de audio</h1>
      <p class="lede">
        Escucha cada sonido y márcalo con ✓ o ✗. Los loops se repiten solos. Al
        terminar, pulsa «Copiar rechazados» y pégamelo en el chat (con lo que
        cambiarías de cada uno).
      </p>
      <div id="list"></div>
    </main>
    <footer>
      <span id="count"></span>
      <button id="copy" type="button">Copiar rechazados</button>
    </footer>
    <script type="module">
      const storeKey = "spellbound-audio-verdicts";
      const read = () => {
        try {
          return JSON.parse(localStorage.getItem(storeKey) ?? "{}");
        } catch {
          return {};
        }
      };
      const write = (value) => {
        try {
          localStorage.setItem(storeKey, JSON.stringify(value));
        } catch {}
      };

      const verdicts = read();
      const catalog = await (
        await fetch("/audio/catalog.json", { cache: "no-store" })
      ).json();
      const list = document.querySelector("#list");
      const count = document.querySelector("#count");

      const refreshCount = () => {
        const values = catalog.map((entry) => verdicts[entry.id]);
        const ok = values.filter((v) => v === "ok").length;
        const no = values.filter((v) => v === "no").length;
        count.textContent = `${ok} ✓ · ${no} ✗ · ${catalog.length - ok - no} sin revisar`;
      };

      let group;
      for (const entry of catalog) {
        if (entry.group !== group) {
          group = entry.group;
          const heading = document.createElement("h2");
          heading.textContent = group;
          list.append(heading);
        }

        const item = document.createElement("div");
        item.className = "item";
        item.dataset.verdict = verdicts[entry.id] ?? "";

        const info = document.createElement("div");
        info.innerHTML = `<div class="name"></div><div class="meta"></div><div class="prompt"></div>`;
        info.querySelector(".name").textContent = entry.label;
        info.querySelector(".meta").textContent =
          `${entry.id} · ${entry.kind === "music" ? "música" : "efecto"} · ${entry.seconds}s${entry.loop ? " · loop" : ""}`;
        info.querySelector(".prompt").textContent = entry.prompt;

        const player = document.createElement("div");
        if (entry.ready) {
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.preload = "none";
          audio.loop = entry.loop;
          audio.src = `${entry.file}?v=${Date.now()}`;
          player.append(audio);
        } else {
          player.innerHTML = `<span class="missing">Aún no generado</span>`;
        }

        const verdict = document.createElement("div");
        verdict.className = "verdict";
        for (const [value, label] of [
          ["ok", "✓"],
          ["no", "✗"],
        ]) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = value;
          button.textContent = label;
          button.addEventListener("click", () => {
            verdicts[entry.id] =
              verdicts[entry.id] === value ? undefined : value;
            item.dataset.verdict = verdicts[entry.id] ?? "";
            write(verdicts);
            refreshCount();
          });
          verdict.append(button);
        }

        item.append(info, player, verdict);
        list.append(item);
      }

      refreshCount();

      document.querySelector("#copy").addEventListener("click", async () => {
        const rejected = catalog
          .filter((entry) => verdicts[entry.id] === "no")
          .map((entry) => `- ${entry.id} (${entry.label}): `)
          .join("\n");
        await navigator.clipboard.writeText(rejected || "Todo aprobado");
        document.querySelector("#copy").textContent = "¡Copiado!";
        setTimeout(
          () =>
            (document.querySelector("#copy").textContent = "Copiar rechazados"),
          1500
        );
      });
    </script>
  </body>
</html>
