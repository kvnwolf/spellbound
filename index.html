<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spellbound</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/logo.css" />
    <!-- The loading screen's own look, inline so it shows from the first paint. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1020;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-content: center;
        gap: 1.4rem;
        padding: 2rem;
        color: #efe4c8;
        font-family:
          "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        text-align: center;
        background: radial-gradient(ellipse at center, #141b33, #0b1020 70%);
      }

      #loading[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="reticle" hidden></div>
    <div id="charge-ring" hidden></div>
    <div id="hud" hidden></div>
    <section id="overlay" hidden></section>
    <section
      id="loading"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <h1>
        <!-- The logo; the menus clone it (overlay.ts). -->
        <svg
          class="logo"
          viewBox="0 0 640 160"
          role="img"
          aria-label="Spellbound"
        >
          <text
            class="logo-word"
            x="320"
            y="74"
            text-anchor="middle"
            textLength="580"
            lengthAdjust="spacing"
          >
            SPELLBOUND
          </text>
          <g class="logo-beam logo-crimson">
            <line
              x1="24"
              y1="118"
              x2="316"
              y2="118"
              stroke="#d9473c"
              stroke-width="6"
            />
            <line
              x1="24"
              y1="118"
              x2="314"
              y2="118"
              stroke="#ffc2b8"
              stroke-width="1.6"
            />
          </g>
          <g class="logo-beam logo-emerald">
            <line
              x1="324"
              y1="118"
              x2="616"
              y2="118"
              stroke="#3fae7a"
              stroke-width="6"
            />
            <line
              x1="326"
              y1="118"
              x2="616"
              y2="118"
              stroke="#c4f2d9"
              stroke-width="1.6"
            />
          </g>
          <g class="logo-flare">
            <circle cx="320" cy="118" r="20" fill="#fff0c8" opacity="0.22" />
            <path
              d="M320 88 L325 112 L350 118 L325 124 L320 148 L315 124 L290 118 L315 112 Z"
              fill="#fff6dc"
            />
            <circle cx="320" cy="118" r="7" fill="#ffffff" />
          </g>
        </svg>
      </h1>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
